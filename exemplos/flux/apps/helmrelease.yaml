apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loja-flux
  namespace: flux-demo
spec:
  interval: 30s
  timeout: 1m
  releaseName: loja-flux
  chart:
    spec:
      chart: ./exemplos/dora/chart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: loja-flux
        namespace: flux-system
  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 0
      strategy: rollback
      remediateLastFailure: true
  values:
    version: flux-v1
    imageTag: 1.28.0-alpine
    broken: false
    failSync: false
