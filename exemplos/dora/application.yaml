apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dora-lab
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/bernardolsp/aula-aovivo-argocd-dorametrics.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: production
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loja-prod
  namespace: argocd
spec:
  project: dora-lab
  source:
    repoURL: https://github.com/bernardolsp/aula-aovivo-argocd-dorametrics.git
    targetRevision: main
    path: exemplos/dora/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  # Sync manual para escolher quando observar cada evento. Sem retry automático.
  syncPolicy: {}
