global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules/*.yaml
scrape_configs:
  - job_name: argocd
    static_configs:
      - targets: ['argocd-metrics.argocd.svc.cluster.local:8082']
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway.monitoring.svc.cluster.local:9091']
