apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja
spec:
  replicas: 1
  progressDeadlineSeconds: 30
  selector:
    matchLabels:
      app: loja
  template:
    metadata:
      labels:
        app: loja
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: loja
          image: nginx:{{ .Values.imageTag }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: loja-config
---
apiVersion: v1
kind: Service
metadata:
  name: loja
spec:
  selector:
    app: loja
  ports:
    - port: 8080
      targetPort: 8080
