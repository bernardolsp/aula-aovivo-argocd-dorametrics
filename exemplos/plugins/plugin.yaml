# Arquivo de configuração do cmp-server; NÃO é um CRD para kubectl apply.
apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: plain-manifest
spec:
  version: v1
  discover:
    fileName: '*.manifest'
  generate:
    command: [sh, -c]
    args: ['cat *.manifest']
  preserveFileMode: false
  provideGitCreds: false
