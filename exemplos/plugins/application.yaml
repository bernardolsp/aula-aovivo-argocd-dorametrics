apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cmp-demo
  namespace: argocd
spec:
  project: dora-lab
  source:
    repoURL: https://github.com/bernardolsp/aula-aovivo-argocd-dorametrics.git
    targetRevision: main
    path: exemplos/plugins/source
    plugin:
      name: plain-manifest-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy: {}
